ics:
  - ERA5
  - EERIE (AMIP)
  - ECMWF analysis
  - EC-Earth3 (CMIP6)

models:
  - name: NeuralGCM
    label: neuralgcm
    supported_modes: amip/hindcast
    checkpoints:
      - id: ngcm_stoc_1_4
        label: stochastic_1_4_deg.pkl
        url: https://neuralgcm.readthedocs.io/en/latest/checkpoints.html
        download_url: https://storage.googleapis.com/neuralgcm/models/v1/stochastic_1_4_deg.pkl
        size: 46,8MB
      - id: ngcm_stoc_2_8_precip
        label: stochastic_precip_2_8_deg.pkl
        url: https://neuralgcm.readthedocs.io/en/latest/checkpoints.html
        download_url: https://storage.googleapis.com/neuralgcm/models/v1_precip/stochastic_precip_2_8_deg.pkl
        size: 44,9MB
      - id: ngcm_stoc_2_8_evap
        label: stochastic_evap_2_8_deg.pkl
        url: https://neuralgcm.readthedocs.io/en/latest/checkpoints.html
        download_url: https://storage.googleapis.com/neuralgcm/models/v1_precip/stochastic_evap_2_8_deg.pkl
        size: 44,6MB
      - id: ngcm_det_0_7
        label: deterministic_0_7_deg.pkl
        url: https://neuralgcm.readthedocs.io/en/latest/checkpoints.html
        download_url: https://storage.googleapis.com/neuralgcm/models/v1/deterministic_0_7_deg.pkl
        size: 126,7MB
      - id: ngcm_det_1_4
        label: deterministic_1_4_deg.pkl
        url: https://neuralgcm.readthedocs.io/en/latest/checkpoints.html
        download_url: https://storage.googleapis.com/neuralgcm/models/v1/deterministic_1_4_deg.pkl
        size: 74MB
      - id: ngcm_det_2_8
        label: deterministic_2_8_deg.pkl
        url: https://neuralgcm.readthedocs.io/en/latest/checkpoints.html
        download_url: https://storage.googleapis.com/neuralgcm/models/v1/deterministic_2_8_deg.pkl
        size: 58,3MB

  - name: AIFS
    label: aifs
    supported_modes: hindcast
    checkpoints:
      - id: aifs_single_1_1
        label: aifs-single-mse-1.1.ckpt
        url: https://huggingface.co/ecmwf/aifs-single-1.1
        download_url: https://huggingface.co/ecmwf/aifs-single-1.1/resolve/main/aifs-single-mse-1.1.ckpt
        size: 994MB
      - id: aifs_ens_1_0
        label: aifs-ens-crps-1.0.ckpt
        url: https://huggingface.co/ecmwf/aifs-ens-1.0
        download_url: https://huggingface.co/ecmwf/aifs-ens-1.0/resolve/main/aifs-ens-crps-1.0.ckpt
        size: 922MB
      - id: aifs_ens_2_0
        label: aifs-ens-crps-2.0.ckpt
        url: https://huggingface.co/ecmwf/aifs-ens-2.0
        download_url: https://huggingface.co/ecmwf/aifs-ens-2.0/resolve/main/aifs-ens-crps-2.0.ckpt
        size: 2.55GB
      

  - name: MS Aurora
    label: ms-aurora
    supported_modes: hindcast
    checkpoints:
      - id: aurora_0_25_pretrained
        label: aurora-0.25-pretrained.ckpt
        url: https://microsoft.github.io/aurora/models.html
        download_url: https://huggingface.co/microsoft/aurora/resolve/main/aurora-0.25-pretrained.ckpt
        size: 5,03GB
      - id: aurora_0_25_finetuned
        label: aurora-0.25-finetuned.ckpt
        url: https://microsoft.github.io/aurora/models.html
        download_url: https://huggingface.co/microsoft/aurora/resolve/main/aurora-0.25-finetuned.ckpt
        size: 5,04GB
      - id: aurora_0_25_v1_5
        label: aurora-0.25-v1.5.ckpt
        url: https://microsoft.github.io/aurora/example_v1p5.html
        download_url: https://huggingface.co/microsoft/aurora/resolve/main/aurora-0.25-v1.5.ckpt
        size: 5,03GB
      - id: aurora_0_25_v1_5_ensemble
        label: aurora-0.25-v1.5-ensemble.ckpt
        url: https://microsoft.github.io/aurora/models.html#aurora-1-5-ensemble-0-25
        download_url: https://huggingface.co/microsoft/aurora/resolve/main/aurora-0.25-v1.5-ensemble.ckpt
        size: 5,04GB

  # Planned for a later release (integration on the models/ace branch).
  - name: ACE
    label: ace
    supported_modes: amip (planned)
    checkpoints:
      - id: ace2_era5
        label: ACE2-ERA5
        url: https://huggingface.co/allenai/ACE2-ERA5
        download_url: https://huggingface.co/allenai/ACE2-ERA5
        size: "-"

# Status IC x checkpoint_id
#   available       = the job chain (PREPARE_ICS, SAVE_ICS for AIFS, SIM, POSTPROCESS for AIFS) ran with
#                     this IC source and checkpoint, and the outputs passed a plausibility check
#                     (no NaN, physical ranges). Release 1.0.0 tests: FELIPE (L40S), 2026-11-17,
#                     2-day forecasts from 2010-01-01 (ERA5) and the 2026-11-16 06Z analysis.
#                     EERIE: statuses from 0.x, not re-tested for 1.0.0 (MARS queue).
#   wip             = integration present but not verified for this combination.
#                     aifs_ens_2_0 (AIFS ENS v2, AIUQ-st v100): integration on branch models/aifs-ens-2,
#                     not yet run on FELIPE. EERIE has no ocean-wave fields, which this checkpoint needs.
#   not_implemented = no integration.
status:
  ERA5:
    ngcm_stoc_1_4: "available"
    ngcm_stoc_2_8_precip: "available"
    ngcm_stoc_2_8_evap: "available"
    ngcm_det_0_7: "available"
    ngcm_det_1_4: "available"
    ngcm_det_2_8: "available"
    aifs_single_1_1: "available"
    aifs_ens_1_0: "available"
    aifs_ens_2_0: "wip"
    aurora_0_25_pretrained: "available"
    aurora_0_25_finetuned: "available"
    aurora_0_25_v1_5: "available"
    aurora_0_25_v1_5_ensemble: "available"
    ace2_era5: "not_implemented"


  EERIE (AMIP):
    ngcm_stoc_1_4: "available"
    ngcm_stoc_2_8_precip: "available"
    ngcm_stoc_2_8_evap: "available"
    ngcm_det_0_7: "available"
    ngcm_det_1_4: "available"
    ngcm_det_2_8: "available"
    aifs_single_1_1: "wip"
    aifs_ens_1_0: "available"
    aifs_ens_2_0: "not_implemented"
    aurora_0_25_pretrained: "wip"
    aurora_0_25_finetuned: "wip"
    aurora_0_25_v1_5: "wip"
    aurora_0_25_v1_5_ensemble: "wip"
    ace2_era5: "not_implemented"

  # Latest IFS analysis from ECMWF Open Data (ICS: ecmwf-an).
  ECMWF analysis:
    ngcm_stoc_1_4: "available"
    ngcm_stoc_2_8_precip: "available"
    ngcm_stoc_2_8_evap: "available"
    ngcm_det_0_7: "available"
    ngcm_det_1_4: "available"
    ngcm_det_2_8: "available"
    aifs_single_1_1: "available"
    aifs_ens_1_0: "available"
    aifs_ens_2_0: "wip"
    aurora_0_25_pretrained: "available"
    aurora_0_25_finetuned: "available"
    aurora_0_25_v1_5: "available"
    aurora_0_25_v1_5_ensemble: "available"
    ace2_era5: "not_implemented"

  # EC-Earth3 CMIP6 state from ESGF (ICS: ec-earth3, branch ics/ec-earth3). PREPARE_ICS tested on
  # synthetic data and live ESGF reads; no model run yet. No ocean-wave fields, which AIFS ENS 2.0 needs.
  EC-Earth3 (CMIP6):
    ngcm_stoc_1_4: "wip"
    ngcm_stoc_2_8_precip: "wip"
    ngcm_stoc_2_8_evap: "wip"
    ngcm_det_0_7: "wip"
    ngcm_det_1_4: "wip"
    ngcm_det_2_8: "wip"
    aifs_single_1_1: "wip"
    aifs_ens_1_0: "wip"
