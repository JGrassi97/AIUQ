  - name: ACE
    label: ace
    supported_modes: amip (planned)
    checkpoints:
      - id: ace2_era5
        label: ACE2-ERA5
        url: https://huggingface.co/allenai/ACE2-ERA5
        download_url: https://huggingface.co/allenai/ACE2-ERA5
        size: "-"

# Status IC x checkpoint_id
#   available       = the job chain (PREPARE_ICS, SAVE_ICS for AIFS, SIM, POSTPROCESS for AIFS, ARCHIVE) ran with
#                     this IC source and checkpoint, and the outputs passed a plausibility check: no NaN,
#                     temperature and geopotential height at 850 and 500 hPa within physical ranges at every
#                     grid point, global means stable over the run, members of ensemble checkpoints different.
#                     Tests on FELIPE (L40S):
#                       2026-11-17 (release 1.0.0): 2-day forecasts from 2010-01-01 (ERA5) and the 2026-11-16 06Z
#                         analysis; EERIE statuses of NeuralGCM and AIFS ENS 1.0 are from 0.x.
#                       2026-11-21 (commit d1880c0): 2-day forecasts, 2 members for ensemble checkpoints, of every
#                         combination that was "wip": AIFS ENS 2.0 from ERA5 (2020-01-15) and from the ECMWF
#                         analysis (2026-11-21); AIFS single 1.1 and the four Aurora checkpoints from EERIE
#                         (2010-01-01); every checkpoint from EC-Earth3 (ssp585, r4i1p1f1, 2050-07-01).
#   wip             = integration present but not verified, or verified and not passing.
#                     NeuralGCM deterministic checkpoints from EC-Earth3: the job chain completes, but the outputs
#                     have unphysical values at isolated points over the tropical oceans from the first output
#                     time (2026-11-21: temperature at 850 hPa up to 3199 K with deterministic_1_4, 380 K with
#                     deterministic_2_8; a few points of geopotential height with deterministic_0_7). The same
#                     checkpoints are clean from ERA5, and the stochastic checkpoints are clean from EC-Earth3.
#                     WeatherNext 2 (branch models/weathernext-2): integration in progress.
#   not_implemented = no integration. AIFS ENS 2.0 needs ocean-wave fields, which EERIE and EC-Earth3 do not have.
status:
  ERA5:
    ngcm_stoc_1_4: "available"
    ngcm_stoc_2_8_precip: "available"
    ngcm_stoc_2_8_evap: "available"
