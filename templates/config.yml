MODEL_NAME: "%MODEL.NAME%"
IC_NAME: "%MODEL.ICS%"
# ICS ec-earth3 only (optional): CMIP6 experiment and member; the card's defaults apply when unset.
IC_EXPERIMENT: "%MODEL.ICS_EXPERIMENT%"
IC_MEMBER: "%MODEL.ICS_MEMBER%"
STD_VERSION: "v100"
INI_DATA_PATH: "%DIRS.INI_DATA_PATH%/%CHUNK_START_DATE%"
START_TIME: '%CHUNK_START_YEAR%-%CHUNK_START_MONTH%-%CHUNK_START_DAY%'
END_TIME: '%CHUNK_END_YEAR%-%CHUNK_END_MONTH%-%CHUNK_END_DAY%'
DATA_INNER_STEPS: 24  
INNER_STEPS: 6        
MEMBERS: "%EXPERIMENT.MEMBERS%"
RNG_KEY: "%MEMBER%"
OUTPUT_PATH: "%HPCROOTDIR%/outputs"
TEMP_DIR: "%HPCROOTDIR%/temp/%MODEL.NAME%/%SDATE%/%MEMBER%/"
ICS_TEMP_DIR: "%HPCROOTDIR%/ics_temp/%MODEL.NAME%/%SDATE%/ics/"
HPCROOTDIR: "%HPCROOTDIR%"
MODEL_CHECKPOINT: "%PATHS.SUPPORT_FOLDER%/models/%MODEL.NAME%/%MODEL.CHECKPOINT_NAME%"
STATIC_DATA: "%PATHS.SUPPORT_FOLDER%/static/AIUQ-static.nc"
STATIC_FOLDER: "%PATHS.SUPPORT_FOLDER%/static"
CLIMATOLOGY_DATA: "%PATHS.SUPPORT_FOLDER%/climatology/AIUQ-climatology.nc"
EERIE_PATH: "%PATHS.SUPPORT_FOLDER%/eerie/"
OUTPUT_TEMP_PATH: "%HPCROOTDIR%/outputs_temp/%MODEL.NAME%/%SDATE%/%MEMBER%/"

OUT_VARS: "%EXPERIMENT.OUT_VARS%"
OUT_FREQ: "%EXPERIMENT.OUT_FREQ%"
OUT_RES: "%EXPERIMENT.OUT_RES%"
OUT_LEVS: "%EXPERIMENT.OUT_LEVS%"
# How the output values are stored (AIUQst_lib/compression.py). Autosubmit passes single values only, so the
# options are one key each and the custom rules a list of texts.
OUT_COMPRESSION: "%EXPERIMENT.OUT_COMPRESSION%"
OUT_COMPRESSION_KEEPBITS: "%EXPERIMENT.OUT_COMPRESSION_OPTS.KEEPBITS%"
OUT_COMPRESSION_CHUNKS: "%EXPERIMENT.OUT_COMPRESSION_OPTS.CHUNKS%"
OUT_COMPRESSION_COMPLEVEL: "%EXPERIMENT.OUT_COMPRESSION_OPTS.COMPLEVEL%"
OUT_COMPRESSION_CUSTOM: "%EXPERIMENT.OUT_COMPRESSION_OPTS.CUSTOM%"
# What the output files say about the run (global attributes), see AIUQst_lib/output.py
INSTITUTION: "%OUTPUT_FORMAT.INSTITUTION%"
EXPID: "%DEFAULT.EXPID%"
CHECKPOINT_NAME: "%MODEL.CHECKPOINT_NAME%"
FORCING_VERSION: "%EXPERIMENT.FORCING_VERSION%"
GIT_COMMIT: "%AUTOSUBMIT.WORKFLOW_COMMIT%"
GIT_BRANCH: "%GIT.PROJECT_BRANCH%"
GIT_ORIGIN: "%GIT.PROJECT_ORIGIN%"

# EXPERIMENTAL - AMIP SIMULATION
CHECKPOINT_DIR: "%HPCROOTDIR%/outputs/checkpoints"
CHUNK_STEPS: 48
RUN_TYPE: "%EXPERIMENT.RUN_TYPE%"  # Options: "amip", "hindcast"
AMIP_FORCING_PATH: "%PATHS.SUPPORT_FOLDER%/amip-forcings/%EXPERIMENT.FORCING_VERSION%/"