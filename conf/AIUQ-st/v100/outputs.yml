AIUQ-st: v100

metadata:
  description : "AIUQ-st v100 output-only variables: fields the models produce (diagnostics, accumulations,
                mean rates and fluxes, soil layers named as in the model output) but never read from the
                initial conditions. They are kept apart from variables.yml so that the initial-condition
                sources are not asked for them. Names, units and codes follow the ECMWF parameter database.
                A model card maps them to its own names in its 'outputs' block; each checkpoint lists what it
                can write in its 'checkpoints' block."
  reference_url : https://codes.ecmwf.int/grib/param-db/
  # accumulated: true   the field is a total over a period (the model step for AIFS, 6 h): daily output
  #                     sums the steps of the day instead of averaging them.
  # Time-mean rates and fluxes (avg_*) are averages over a period, given for each model by the 'window' of
  # its card; daily output averages them. Names as in ecCodes (the ERA5 names were mtpr, msr, mer, msdwswrf,
  # mtnlwrf, msdwuvrf).

