AIUQ-st: v100 

metadata: 
  description : "AIUQ-st v100 variable definitions based on ECMWF GRIB2 parameter database. All the
                variables here respect the ECMWF standard names, units and types where applicable. The only
                exception is the orography here named orog and flagged with 999999 code.
                v100 adds the ocean-wave fields (type wave, parameter table 140) needed by the AIFS v2
                models: they are defined over sea only (NaN over land) and are optional, so an initial
                condition source that cannot provide them (for example EERIE) is still valid for the
                models that do not use them."
  reference_url : https://codes.ecmwf.int/grib/param-db/
  # Every variable is also described as the CF conventions ask (https://cfconventions.org), which is what the
  # output files carry (runscripts/AIUQst_lib/output.py):
  #   units          the ECMWF units in CF (UDUNITS) notation: m2 s-2, "1" for fractions and pure numbers
  #   standard_name  CF standard name (table version 95), where one describes the field; otherwise absent
  #   height         metres above the surface, for fields at a fixed height (2 m, 10 m, 100 m)
  # pack: how the outputs may be stored as integers (EXPERIMENT.OUT_COMPRESSION, AIUQst_lib/compression.py):
  #   the step between two stored values, in the units of the variable, for the presets 'mixed' and 'integer',
  #   and an optional offset subtracted before (273.15: temperatures are stored in whole degrees Celsius).
  #   Variables without it keep their significant bits instead (humidity, cloud water, vertical velocity ...).
  # Variable types:  sfc  single level    pl  pressure level    soil  soil layers
  #                  wave ocean waves (sea points only, NaN over land)
  # optional: true   the IC retrieval only warns when the variable has no source; a model whose
  #                  card requires it fails at SAVE_ICS/SIM with a clear message.
  
