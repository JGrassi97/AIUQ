# Platforms known to AIUQ. Nothing here is personal: the HPC user comes from the experiment's conf/main.yml
# (PLATFORM.USER_CODE). To run on another machine, add its platforms here and its job files under
# conf/jobs/<PLATFORM.NAME>/ (see "Running AIUQ at a new site" in the documentation).
PLATFORMS:

  MARENOSTRUM5ACC:
    TYPE: SLURM
    HOST: alogin1.bsc.es
    PROJECT: ehpc536
    USER: "%PLATFORM.USER_CODE%"
    QUEUE: acc_ehpc
    SCRATCH_DIR: /gpfs/scratch
    ADD_PROJECT_TO_HOST: False
    TEMP_DIR: ''
    PROCESSORS_PER_NODE: 80
    MAX_PROCESSORS: 80
    MAX_WALLCLOCK: '01:30'

  MARENOSTRUM5-LOGIN:
    TYPE: ps
    HOST: glogin4.bsc.es
    PROJECT: ehpc536
    USER: "%PLATFORM.USER_CODE%"
    QUEUE: acc_ehpc
    SCRATCH_DIR: /gpfs/scratch
    ADD_PROJECT_TO_HOST: False
    TEMP_DIR: ''
    PROCESSORS_PER_NODE: 112
    CUSTOM_DIRECTIVES: ''
    MAX_WALLCLOCK: '01:30'

  MARENOSTRUM5-LOGIN-NOOVERLAP:
    TYPE: ps
    HOST: glogin4.bsc.es
    PROJECT: ehpc536
    USER: "%PLATFORM.USER_CODE%"
    QUEUE: acc_ehpc
    SCRATCH_DIR: /gpfs/scratch
    ADD_PROJECT_TO_HOST: False
    TEMP_DIR: ''
    PROCESSORS_PER_NODE: 112
    CUSTOM_DIRECTIVES: ''
    MAX_WALLCLOCK: '01:30'
    MAX_WAITING_JOBS: 20
    TOTAL_JOBS: 1

  MARENOSTRUM5-LOGIN-NOOVERLAP-2:
    TYPE: ps
    HOST: glogin4.bsc.es
    PROJECT: ehpc536
    USER: "%PLATFORM.USER_CODE%"
    QUEUE: acc_ehpc
    SCRATCH_DIR: /gpfs/scratch
    ADD_PROJECT_TO_HOST: False
    TEMP_DIR: ''
    PROCESSORS_PER_NODE: 112
    CUSTOM_DIRECTIVES: ''
    MAX_WALLCLOCK: '01:30'
    MAX_WAITING_JOBS: 20
    TOTAL_JOBS: 2

  MARENOSTRUM5-LOGIN-ACC:
    TYPE: ps
    HOST: alogin4.bsc.es
    PROJECT: ehpc536
    USER: "%PLATFORM.USER_CODE%"
    QUEUE: acc_ehpc
    SCRATCH_DIR: /gpfs/scratch
    ADD_PROJECT_TO_HOST: False
    TEMP_DIR: ''
    PROCESSORS_PER_NODE: 112
    CUSTOM_DIRECTIVES: ''
    MAX_WALLCLOCK: '01:30'


  ###############################################################
  #####          FELIPE (Politecnico di Torino)             #####
  ###############################################################
  # Experiment folders: <SCRATCH_DIR>/<PROJECT>/<USER>/<expid>
  FELIPE:
    TYPE: ps
    HOST: felipe.polito.it
    USER: "%PLATFORM.USER_CODE%"
    PROJECT: test
    ADD_PROJECT_TO_HOST: false
    SCRATCH_DIR: "/work/users/%PLATFORM.USER_CODE%/autosubmit_scratch"
    QUEUE: serial
    TOTAL_JOBS: 1
    MAX_WALLCLOCK: "02:00"

  FELIPE-INFERENCE:
    TYPE: SLURM
    HOST: felipe.polito.it
    PROJECT: test
    USER: "%PLATFORM.USER_CODE%"
    # GPU jobs on felipe are only accepted in the 'gpu' (2 days) or 'fat_felipe' (12 h) partitions.
    PARTITION: gpu
    SCRATCH_DIR: "/work/users/%PLATFORM.USER_CODE%/autosubmit_scratch"
    ADD_PROJECT_TO_HOST: False
    PROCESSORS_PER_NODE: 168
    MAX_PROCESSORS: 168
    MAX_WALLCLOCK: "02:00"

  FELIPE-GENERAL:
    TYPE: SLURM
    HOST: felipe.polito.it
    PROJECT: test
    USER: "%PLATFORM.USER_CODE%"
    SCRATCH_DIR: "/work/users/%PLATFORM.USER_CODE%/autosubmit_scratch"
    ADD_PROJECT_TO_HOST: False
    PROCESSORS_PER_NODE: 168
    MAX_PROCESSORS: 168
    MAX_WALLCLOCK: "02:00"

  FELIPE-NOOVERLAP:
    TYPE: SLURM
    HOST: felipe.polito.it
    PROJECT: test
    USER: "%PLATFORM.USER_CODE%"
    SCRATCH_DIR: "/work/users/%PLATFORM.USER_CODE%/autosubmit_scratch"
    ADD_PROJECT_TO_HOST: False
    PROCESSORS_PER_NODE: 168
    MAX_PROCESSORS: 168
    MAX_WALLCLOCK: "02:00"
    TOTAL_JOBS: 1