# WeatherNext 2 on MareNostrum 5 (H100 64 GB). Not tested on this platform.
JOBS:
  PREPARE_ICS:
    CHECK: on_submission
    FILE: templates/prepare_ics.sh
    DEPENDENCIES: SYNCHRONIZE

  SIM:
    CHECK: on_submission
    FILE: templates/sim_weathernext.sh,templates/config.yml
    PLATFORM: "MARENOSTRUM5ACC"
    DEPENDENCIES: SIM-1 PREPARE_ICS
    RUNNING: CHUNK
    NODES: 1
    PROCESSORS: 20
    CUSTOM_DIRECTIVES: "#SBATCH --gres=gpu:1"
  
  CLEAN:
    CHECK: on_submission
    FILE: templates/clean.sh
    PLATFORM: "MARENOSTRUM5-LOGIN"
    DEPENDENCIES: SIM
    RUNNING: DATE
    NODES: 1
    PROCESSORS: 1
