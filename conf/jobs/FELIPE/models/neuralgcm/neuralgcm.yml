# Resources measured on felipe (Slurm cgroup v2, RAM strictly enforced; jobs without MEMORY
# get 1 GB per CPU). MEMORY is in MB.
# Measured 2026-11-17 (hindcast unrolled in CHUNK_STEPS blocks, outputs streamed to disk):
#   0.7 deg, 30 days, 5 variables on all 37 levels: ~12.5 GB base, ~15 min on an L40S;
#   1.4 deg, 20 days: ~9 GB, ~2.5 min.
JOBS:
  PREPARE_ICS:
    CHECK: on_submission
    FILE: templates/prepare_ics.sh
    # At most two start dates ahead: the initial conditions of a date are prepared once every SIM job two
    # dates earlier has finished, so the HPC holds the initial conditions and outputs of a few dates only and
    # Slurm never sees more than about two dates of SIM jobs (members x chunks each). Adds to the dependency of
    # conf/jobs/<platform>/ics/<ics>/<ics>.yml. A stricter limit in main.yml: DEPENDENCIES: SIM-1.
    DEPENDENCIES: SIM-2

  SIM:
    CHECK: on_submission
    FILE: templates/sim_neuralgcm.sh,templates/config.yml
    PLATFORM: FELIPE-INFERENCE
    DEPENDENCIES: SIM-1 PREPARE_ICS
    RUNNING: CHUNK
    WALLCLOCK: "01:00"
    NODES: 1
    PROCESSORS: 1
    THREADS: 20
    MEMORY: 49152
    CUSTOM_DIRECTIVES: "#SBATCH --gres=gpu:1"

  STORE:
    # Moves the outputs of one start date to OUTPUT_STORE.DIR (conf/general.yml) and removes its initial
    # conditions, as soon as every job of that date is done (templates/store.sh). Runs on the Autosubmit host.
    CHECK: on_submission
    FILE: templates/store.sh
    PLATFORM: local
    RUNNING: date
    DEPENDENCIES: SIM

  ARCHIVE:
    # Moves what is left (logs, code, checkpoints) once every STORE job is done (templates/archive.sh).
    CHECK: on_submission
    FILE: templates/archive.sh
    PLATFORM: local
    RUNNING: once
    DEPENDENCIES:
      STORE:
        DATES_TO: all