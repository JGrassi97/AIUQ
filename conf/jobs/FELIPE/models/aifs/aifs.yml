JOBS:

  WARMUP_REGRID:
    CHECK: on_submission
    FILE: templates/warmup_regrid.sh,templates/config.yml
    PLATFORM: FELIPE
    RUNNING: ONCE
    DEPENDENCIES: SYNCHRONIZE
    PROCESSORS: 80

  WARMUP_REGRID_ACC:
    CHECK: on_submission
    FILE: templates/warmup_regrid.sh,templates/config.yml
    PLATFORM: FELIPE
    RUNNING: ONCE
    DEPENDENCIES: WARMUP_REGRID
    PROCESSORS: 80

  PREPARE_ICS:
    CHECK: on_submission
    FILE: templates/prepare_ics.sh
    DEPENDENCIES: WARMUP_REGRID_ACC
    PLATFORM: FELIPE

  SAVE_ICS:
    CHECK: on_submission
    FILE: templates/ics_aifs.sh,templates/config.yml
    PLATFORM: FELIPE-INFERENCE
    DEPENDENCIES: PREPARE_ICS
    RUNNING: DATE
    NODES: 1
    PROCESSORS: 1
    THREADS: 20
    CUSTOM_DIRECTIVES: "#SBATCH --gres=gpu:1"

  SIM:
    CHECK: on_submission
    FILE: templates/sim_aifs.sh,templates/config.yml
    PLATFORM: FELIPE-INFERENCE
    DEPENDENCIES: SAVE_ICS
    RUNNING: CHUNK
    NODES: 1
    PROCESSORS: 1
    THREADS: 20
    CUSTOM_DIRECTIVES: "#SBATCH --gres=gpu:1"