ic_name: ecmwf-an
ic_source: ecmwf_open_data

# IFS HRES analysed state (step 0 of the operational runs) from ECMWF Open Data
# (CC BY 4.0, https://www.ecmwf.int/en/forecasts/datasets/open-data).
# The latest cycle T with both T-6h and T published is selected, among the cycles
# from START_TIME - max_lookback_hours up to START_TIME 18 UTC. With DATELIST set to
# today the forecast starts from the newest analysis available when PREPARE_ICS runs.
open_data:
  # Tried in order. data.ecmwf.int keeps ~4 days; the Google Cloud mirror keeps the
  # archive (0.25 deg files exist from 2024-02). Both share the same layout. The AWS
  # mirror (ecmwf-forecasts.s3.eu-central-1.amazonaws.com) often answers 503 SlowDown.
  sources:
    - https://data.ecmwf.int/forecasts
    - https://storage.googleapis.com/ecmwf-open-data
  model: ifs
  resol: 0p25
  # Since IFS 50r1 (12 May 2026) all cycles use 'oper'; older 06/18 UTC runs use 'scda'.
  streams: [oper, scda]
  # Ocean-wave fields (variables with 'stream: wave' below) come from the wave model file of
  # the same cycle; a cycle is used only when both files are published.
  wave_stream: wave
  max_lookback_hours: 24
  # Number of parallel HTTP range requests per file.
  workers: 8

# Fields downloaded but not exposed as standard variables (used to derive sst/ci).
auxiliary:
  sfc: [lsm, sithick]

# Pressure levels published in Open Data (since 50r1). Values outside this range
# (1-7 hPa) are extrapolated: constant t/u/v/q/w, hypsometric z.
pressure_levels:
  name : isobaricInhPa
  units : hPa
  values : [
    10, 50, 100, 150, 200, 250, 300, 400, 500, 600, 700, 850, 925, 1000
  ]

# Standard ID -> Open Data parameter (short name, levtype). Variables not listed here
# come from the static (slt, lsm, sdor, slor, orog) or climatology (clwc, ciwc) cards;
# 'derived' variables are computed from the downloaded fields. 'stream: wave' marks the
# fields of the wave model (sea points only, missing over land).
variables:
  31  :
    name : ci
    derived : true
